services:
  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: labadmin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "192.168.88.108:3000:3000"
    secrets:
      - grafana_admin_password
    volumes:
      - ./data:/var/lib/grafana
      - ./prometheus/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./prometheus/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/home-lab.yml:ro
      - ./prometheus/grafana-dashboard.json:/var/lib/grafana/dashboards/home-lab.json:ro

secrets:
  grafana_admin_password:
    file: ./grafana/secrets/grafana_admin_password
