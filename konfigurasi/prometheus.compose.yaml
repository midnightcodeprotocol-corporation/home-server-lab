services:
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.11.0
    container_name: pve-exporter
    restart: unless-stopped
    environment:
      REQUESTS_CA_BUNDLE: /etc/pve/pve-root-ca.pem
    volumes:
      - ./prometheus/secrets/pve.yml:/etc/prometheus/pve.yml:ro
      - ./prometheus/secrets/pve-root-ca.pem:/etc/pve/pve-root-ca.pem:ro
    networks:
      - metrics

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "192.168.88.107:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    networks:
      - metrics

networks:
  metrics:
    name: home-lab-metrics
