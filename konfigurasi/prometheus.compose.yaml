services:
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.11.0
    container_name: pve-exporter
    restart: unless-stopped
    environment:
      REQUESTS_CA_BUNDLE: /etc/pve/pve-root-ca.pem
    volumes:
      - ./secrets/pve.yml:/etc/prometheus/pve.yml:ro
      - ./secrets/pve-root-ca.pem:/etc/pve/pve-root-ca.pem:ro
    networks:
      - metrics

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data:/prometheus
    networks:
      - metrics

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: labadmin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "192.168.88.20:3000:3000"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/home-lab.yml:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/home-lab.json:ro
    networks:
      - metrics

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

volumes:
  grafana-data:

networks:
  metrics:
    name: home-lab-metrics
