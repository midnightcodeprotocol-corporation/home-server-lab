vrrp_instance DNS_VIP {
    state MASTER          # di server cadangan ganti BACKUP
    interface eth0        # nama kartu jaringan
    virtual_router_id 51
    priority 150          # di server cadangan pakai 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass GANTI8
    }
    virtual_ipaddress {
        192.168.88.5/24
    }
}
