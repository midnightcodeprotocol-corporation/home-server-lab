services:
  server:
    image: codeberg.org/forgejo/forgejo:<VERSI-MAYOR>   # ganti dengan versi mayor terbaru, mis. 11
    container_name: forgejo
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
    volumes:
      - ./forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"
