services:
  jellyfin:
    image: ghcr.io/jellyfin/jellyfin@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - /srv/jellyfin:/media:ro
      - jellyfin-config:/config
      - jellyfin-cache:/cache

volumes:
  jellyfin-config:
    name: jellyfin-config
    external: true
  jellyfin-cache:
    name: jellyfin-cache
    external: true
