services:
  n8n-db:
    image: postgres:18
    container_name: n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?create a private .env file}
      POSTGRES_DB: n8n
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - ./db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: "0.50"
    security_opt:
      - no-new-privileges:true
    networks:
      - n8n-internal

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?set a pinned stable version}
    container_name: n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      N8N_HOST: 192.168.88.113
      N8N_PROTOCOL: http
      N8N_PORT: "5678"
      N8N_EDITOR_BASE_URL: http://192.168.88.113:5678/
      WEBHOOK_URL: http://192.168.88.113:5678/
      N8N_PROXY_HOPS: "0"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?create a private .env file}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /srv/media/Inbox;/srv/media/Movies;/srv/media/Shows
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?create a private .env file}
    volumes:
      - ./data:/home/node/.n8n
      - /srv/media:/srv/media
    ports:
      - "192.168.88.113:5678:5678"
    group_add:
      - "2000"
    mem_limit: 1g
    cpus: "1.00"
    security_opt:
      - no-new-privileges:true
    networks:
      - n8n-internal

  media-organizer:
    image: home-lab/n8n-media-organizer:1.0.0
    build:
      context: ./media-organizer
    container_name: n8n-media-organizer
    restart: unless-stopped
    user: "1000:2000"
    read_only: true
    environment:
      MEDIA_ROOT: /srv/media
      TZ: Asia/Jakarta
    volumes:
      - /srv/media:/srv/media:rw
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    mem_limit: 128m
    cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - n8n-internal

networks:
  n8n-internal:
