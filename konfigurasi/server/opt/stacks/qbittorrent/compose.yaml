services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "2000"
      TZ: Asia/Jakarta
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ./config:/config
      - /srv/media-inbox:/inbox
      - /srv/torrent:/downloads
    ports:
      - "192.168.88.114:8080:8080/tcp"
      - "192.168.88.114:6881:6881/tcp"
      - "192.168.88.114:6881:6881/udp"
    mem_limit: 768m
    cpus: "0.90"
    security_opt:
      - no-new-privileges:true

  portainer_agent:
    image: portainer/agent:2.45.3
    container_name: portainer_agent
    restart: unless-stopped
    ports:
      - "192.168.88.114:9001:9001/tcp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
      - /run/docker/plugins:/run/docker/plugins
    mem_limit: 128m
    cpus: "0.10"
    security_opt:
      - no-new-privileges:true
